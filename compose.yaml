# ABOUTME: Runs the Coding Agent service on the NAS with a read-only root, no capabilities, and data under /volume2.
services:
  coding-agent:
    build: .
    image: "${CODING_AGENT_IMAGE:-coding-agent:local}"
    container_name: coding-agent
    restart: unless-stopped
    ports:
      - "${CODING_AGENT_HTTP_PORT:-8081}:8080"
    env_file:
      - ./.runtime.env
    environment:
      PORT: "8080"
      CODING_AGENT_WORK_ROOT: /work
      CODING_AGENT_MANIFEST: /config/manifest.json
      # Shared caches so each run does not re-download dependencies and browsers.
      CODING_AGENT_COMMAND_ENV_npm_config_cache: /cache/npm
      CODING_AGENT_COMMAND_ENV_PLAYWRIGHT_BROWSERS_PATH: /cache/ms-playwright
    volumes:
      - "${CODING_AGENT_DATA:-/volume2/docker/coding-agent-data}/work:/work"
      - "${CODING_AGENT_DATA:-/volume2/docker/coding-agent-data}/cache:/cache"
      - ./manifest.json:/config/manifest.json:ro
    # Docker's embedded resolver cannot reach the NAS resolver from a bridge network.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
